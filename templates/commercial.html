<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BizStack Commercial Terminal</title>
    <style>
        body { background: #0a0a0a; color: #e0e0e0; font-family: monospace; padding: 40px; }
        .form-container { max-width: 500px; margin: 0 auto; border: 1px solid #222; padding: 30px; background: #111; border-radius: 4px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #00ffcc; }
        input, select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; color: #fff; box-sizing: border-box; }
        button { background: #00ffcc; color: #000; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Commercial Pipeline Ingestion</h2>
        <form action="/contact" method="post">
            <div class="input-group">
                <label>Corporate Officer Name</label>
                <input type="text" name="full_name" required>
            </div>
            <div class="input-group">
                <label>Registered Business Entity</label>
                <input type="text" name="company_name" required>
            </div>
            <div class="input-group">
                <label>Commercial Contact Email</label>
                <input type="email" name="work_email" required>
            </div>
            <div class="input-group">
                <label>Financing Requirements</label>
                <select name="interest">
                    <option value="Commercial Business Loan">Commercial Business Loan</option>
                    <option value="Prepaid Operational Card">Prepaid Operational Card Yield</option>
                </select>
            </div>
            <input type="hidden" name="marketing_consent" value="true">
            <button type="submit">Transmit Authorization Request</button>
        </form>
    </div>
</body>
</html>
