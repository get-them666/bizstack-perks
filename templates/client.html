<!DOCTYPE html>
<html>
<head>
    <title>Strategic Capital Intake Portal</title>
</head>
<body>
    <!-- Explicitly set the endpoint and method to avoid routing dropping -->
    <form action="/api/v1/submit-lead" method="POST">
        <label>APPLICANT FULL NAME:</label><br>
        <input type="text" name="client_name" required><br><br>

        <label>ESTIMATED CREDIT SCORE MATRIX:</label><br>
        <select name="credit_score">
            <option value="excellent">Excellent (720+)</option>
            <option value="good">Good (660-719)</option>
            <option value="fair">Fair (600-659)</option>
            <option value="poor">Poor (<600)</option>
        </select><br><br>

        <label>REQUESTED CAPITAL VALUE ($):</label><br>
        <input type="number" name="loan_amount" required><br><br>

        <button type="submit">[ EXECUTE APPLICATION INTAKE ]</button>
    </form>
</body>
</html>
