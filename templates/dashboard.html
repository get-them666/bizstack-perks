
<!-- 📊 UPGRADED MONETIZED FINANCIAL LEDGER -->
<div id="financial-ledger" class="max-w-7xl mx-auto mt-6 p-6 bg-slate-900 border border-slate-800 rounded-2xl text-slate-100 font-mono">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
        <h2 class="text-md font-bold tracking-wider text-emerald-400">💵 BIZSTACK REVENUE & PAYOUT LEDGER</h2>
        <span class="text-[10px] bg-slate-950 text-slate-500 border border-slate-800 px-2 py-0.5 rounded">MONETIZATION MODULE: ACTIVE</span>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <!-- Gross Processed -->
        <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col justify-between">
            <span class="text-xs text-slate-500 font-bold tracking-wide uppercase">Gross Volume</span>
            <span class="text-lg font-extrabold text-slate-300" id="ledger-gross">$0.00</span>
        </div>

        <!-- YOUR CUT CARD -->
        <div class="p-4 bg-slate-950 border-emerald-900/50 bg-gradient-to-b from-slate-950 to-emerald-950/20 rounded-xl flex flex-col justify-between border-2">
            <span class="text-xs text-emerald-400 font-bold tracking-wide uppercase flex items-center gap-1">💰 Your 3% Cut</span>
            <span class="text-2xl font-black text-emerald-400 mt-2" id="ledger-commission">$0.00</span>
        </div>

        <!-- Net User Payouts -->
        <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col justify-between">
            <span class="text-xs text-slate-500 font-bold tracking-wide uppercase">Net User Claims</span>
            <span class="text-lg font-extrabold text-indigo-400 mt-2" id="ledger-net">$0.00</span>
        </div>

        <!-- Pending Escrow -->
        <div class="p-4 bg-slate-950 border border-slate-800 rounded-xl flex flex-col justify-between">
            <span class="text-xs text-slate-500 font-bold tracking-wide uppercase">Pending Escrow</span>
            <span class="text-lg font-extrabold text-amber-400 mt-2" id="ledger-pending">$0.00</span>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    async function fetchMonetizationData() {
        try {
            const res = await fetch('/api/financials/ledger-with-fee');
            if (!res.ok) return;
            const body = await res.json();
            const data = body.metrics;

            // Render calculations with 2 decimal formatting
            document.getElementById('ledger-gross').innerText = `$${data.gross_volume.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('ledger-commission').innerText = `$${data.your_commission_cut.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('ledger-net').innerText = `$${data.user_payouts.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('ledger-pending').innerText = `$${data.pending_escrow.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        } catch (err) {
            console.error("Monetization streaming failure:", err);
        }
    }
    fetchMonetizationData();
    setInterval(fetchMonetizationData, 10000);
});
</script>
