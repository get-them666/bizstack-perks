<div class="ingestion-terminal" id="terminal">
    <h2>⚡ Secure Gateway Data Matrix</h2>
    <form action="/api/pipeline-load-trigger" method="POST">
        <div class="form-grid">
            <div class="input-wrapper">
                <label>Commercial Entity Name</label>
                <input type="text" name="company_name" placeholder="Automated API Feed Mode" disabled>
            </div>
            <div class="input-wrapper">
                <label>Gross Annual Revenue (USD)</label>
                <input type="text" name="annual_revenue" placeholder="Automated API Feed Mode" disabled>
            </div>
            <div class="input-wrapper">
                <label>Credit Risk Rating</label>
                <input type="text" name="credit_risk" placeholder="Automated API Feed Mode" disabled>
            </div>
        </div>
        <button type="submit">Execute Secure Pipeline Load</button>
    </form>
</div>
