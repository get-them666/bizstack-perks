<div class="ingestion-terminal" id="terminal">
    <h2>⚡ Secure Gateway Data Matrix</h2>
    <form action="/api/pipeline-load-trigger" method="POST">
        <div class="form-grid">
            <div class="input-wrapper">
                <label>Commercial Entity Name</label>
                <input type="text" name="company_name" placeholder="Enter company name" required>
            </div>
            <div class="input-wrapper">
                <label>Gross Annual Revenue (USD)</label>
                <input type="number" name="annual_revenue" placeholder="Enter revenue" step="0.01" required>
            </div>
            <div class="input-wrapper">
                <label>Credit Risk Rating</label>
                <select name="credit_risk" required>
                    <option value="">Select risk level</option>
                    <option value="Low Risk">Low Risk</option>
                    <option value="Medium Risk">Medium Risk</option>
                    <option value="High Risk">High Risk</option>
                </select>
            </div>
        </div>
        <button type="submit">Execute Secure Pipeline Load</button>
    </form>
</div>
